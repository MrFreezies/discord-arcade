<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Retro Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #1e1f22; color: #f2f3f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #2b2d31; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111214; }
    h1 { font-size: 1.1rem; font-weight: 700; }
    #back-btn { background: #5865f2; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; display: none; }
    #back-btn:hover { background: #4752c4; }
    #library { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; overflow-y: auto; flex: 1; }
    .game-card { background: #2b2d31; border: 1px solid #3f4147; border-radius: 8px; padding: 16px; cursor: pointer; transition: transform 0.1s, border-color 0.1s; display: flex; flex-direction: column; justify-content: space-between; }
    .game-card:hover { transform: translateY(-2px); border-color: #5865f2; }
    .system-badge { display: inline-block; background: #5865f2; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 12px; width: fit-content; margin-bottom: 8px; text-transform: uppercase; }
    .game-title { font-size: 1rem; font-weight: 600; }
    #player-container { flex: 1; width: 100%; height: 100%; display: none; background: #000; }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <header>
    <h1 id="header-title">Retro Arcade Library</h1>
    <button id="back-btn" onclick="location.reload()">Back to Games</button>
  </header>

  <div id="library"></div>

  <div id="player-container">
    <div id="game"></div>
  </div>

  <script type="module">
    import { DiscordSDK, patchUrlMappings } from "https://jsdelivr.net";

    const DISCORD_CLIENT_ID = "YOUR_DISCORD_CLIENT_ID";

    const GAMES = [
      { title: "California Games II", system: "snes", file: "./roms/California Games II (USA).zip" },
      { title: "Captain America and the Avengers", system: "snes", file: "./roms/Captain America and the Avengers (USA).zip" },
      { title: "Castlevania - Dracula X", system: "snes", file: "./roms/Castlevania - Dracula X (USA).zip" },
      { title: "Chrono Trigger", system: "snes", file: "./roms/Chrono Trigger (USA).zip" },
      { title: "Clay Fighter", system: "snes", file: "./roms/Clay Fighter (USA).zip" },
      { title: "Clay Fighter 2 - Judgment Clay", system: "snes", file: "./roms/Clay Fighter 2 - Judgment Clay (USA).zip" },
      { title: "Donkey Kong Country - Competition Cartridge", system: "snes", file: "./roms/Donkey Kong Country - Competition Cartridge (USA).zip" },
      { title: "Donkey Kong Country", system: "snes", file: "./roms/Donkey Kong Country (USA) (Rev 2).zip" },
      { title: "Donkey Kong Country 2 - Diddy's Kong Quest", system: "snes", file: "./roms/Donkey Kong Country 2 - Diddy's Kong Quest (USA) (En,Fr) (Rev 1).zip" },
      { title: "Donkey Kong Country 3 - Dixie Kong's Double Trouble!", system: "snes", file: "./roms/Donkey Kong Country 3 - Dixie Kong's Double Trouble! (USA) (En,Fr).zip" },
      { title: "Earthworm Jim", system: "snes", file: "./roms/Earthworm Jim (USA).zip" },
      { title: "Earthworm Jim 2", system: "snes", file: "./roms/Earthworm Jim 2 (USA).zip" },
      { title: "Final Fantasy - Mystic Quest", system: "snes", file: "./roms/Final Fantasy - Mystic Quest (USA) (Rev 1).zip" },
      { title: "Final Fantasy II", system: "snes", file: "./roms/Final Fantasy II (USA) (Rev 1).zip" },
      { title: "Final Fantasy III", system: "snes", file: "./roms/Final Fantasy III (USA) (Rev 1).zip" },
      { title: "Home Alone", system: "snes", file: "./roms/Home Alone (USA).zip" },
      { title: "Home Alone 2 - Lost in New York", system: "snes", file: "./roms/Home Alone 2 - Lost in New York (USA).zip" },
      { title: "Home Improvement - Power Tool Pursuit!", system: "snes", file: "./roms/Home Improvement - Power Tool Pursuit! (USA).zip" },
      { title: "Indiana Jones' Greatest Adventures", system: "snes", file: "./roms/Indiana Jones' Greatest Adventures (USA).zip" },
      { title: "Killer Instinct", system: "snes", file: "./roms/Killer Instinct (USA) (Rev 1).zip" },
      { title: "Last Action Hero", system: "snes", file: "./roms/Last Action Hero (USA).zip" },
      { title: "Mega Man 7", system: "snes", file: "./roms/Mega Man 7 (USA).zip" },
      { title: "Mega Man Soccer", system: "snes", file: "./roms/Mega Man Soccer (USA).zip" },
      { title: "Mega Man X", system: "snes", file: "./roms/Mega Man X (USA) (Rev 1).zip" },
      { title: "Mega Man X2", system: "snes", file: "./roms/Mega Man X2 (USA).zip" },
      { title: "Mega Man X3", system: "snes", file: "./roms/Mega Man X3 (USA).zip" },
      { title: "Mortal Kombat", system: "snes", file: "./roms/Mortal Kombat (USA) (Rev 1).zip" },
      { title: "Mortal Kombat 3", system: "snes", file: "./roms/Mortal Kombat 3 (USA).zip" },
      { title: "Mortal Kombat II", system: "snes", file: "./roms/Mortal Kombat II (USA) (Rev 1).zip" },
      { title: "NBA All-Star Challenge", system: "snes", file: "./roms/NBA All-Star Challenge (USA).zip" },
      { title: "NBA Give 'n Go", system: "snes", file: "./roms/NBA Give 'n Go (USA).zip" },
      { title: "NBA Hang Time", system: "snes", file: "./roms/NBA Hang Time (USA).zip" },
      { title: "NBA Jam - Tournament Edition", system: "snes", file: "./roms/NBA Jam - Tournament Edition (USA).zip" },
      { title: "NBA Jam", system: "snes", file: "./roms/NBA Jam (USA) (Rev 1).zip" },
      { title: "NBA Live 95", system: "snes", file: "./roms/NBA Live 95 (USA).zip" },
      { title: "NBA Live 96", system: "snes", file: "./roms/NBA Live 96 (USA).zip" },
      { title: "NBA Live 97", system: "snes", file: "./roms/NBA Live 97 (USA).zip" },
      { title: "NBA Live 98", system: "snes", file: "./roms/NBA Live 98 (USA).zip" },
      { title: "NBA Showdown", system: "snes", file: "./roms/NBA Showdown (USA).zip" },
      { title: "Pac-Man 2 - The New Adventures", system: "snes", file: "./roms/Pac-Man 2 - The New Adventures (USA).zip" },
      { title: "Street Fighter Alpha 2", system: "snes", file: "./roms/Street Fighter Alpha 2 (USA).zip" },
      { title: "Street Fighter II", system: "snes", file: "./roms/Street Fighter II (USA).zip" },
      { title: "Street Fighter II Turbo", system: "snes", file: "./roms/Street Fighter II Turbo (USA) (Rev 1).zip" },
      { title: "Super Bomberman", system: "snes", file: "./roms/Super Bomberman (USA).zip" },
      { title: "Super Bomberman 2", system: "snes", file: "./roms/Super Bomberman 2 (USA).zip" },
      { title: "Super Castlevania IV", system: "snes", file: "./roms/Super Castlevania IV (USA).zip" },
      { title: "Super Double Dragon", system: "snes", file: "./roms/Super Double Dragon (USA).zip" },
      { title: "Super Ghouls 'N Ghosts", system: "snes", file: "./roms/Super Ghouls 'N Ghosts (USA).zip" },
      { title: "Super Mario All-Stars", system: "snes", file: "./roms/Super Mario All-Stars (USA).zip" },
      { title: "Super Mario All-Stars + Super Mario World", system: "snes", file: "./roms/Super Mario All-Stars + Super Mario World (USA).zip" },
      { title: "Super Mario Kart", system: "snes", file: "./roms/Super Mario Kart (USA).zip" },
      { title: "Super Mario RPG - Legend of the Seven Stars", system: "snes", file: "./roms/Super Mario RPG - Legend of the Seven Stars (USA).zip" },
      { title: "Super Mario World", system: "snes", file: "./roms/Super Mario World (USA).zip" },
      { title: "Super Mario World 2 - Yoshi's Island", system: "snes", file: "./roms/Super Mario World 2 - Yoshi's Island (USA).zip" },
      { title: "Super R-Type", system: "snes", file: "./roms/Super R-Type (USA).zip" },
      { title: "Super Street Fighter II", system: "snes", file: "./roms/Super Street Fighter II (USA).zip" },
      { title: "Wario's Woods", system: "snes", file: "./roms/Wario's Woods (USA).zip" },
      { title: "Wayne's World", system: "snes", file: "./roms/Wayne's World (USA).zip" },
      { title: "WWF Raw", system: "snes", file: "./roms/WWF Raw (USA).zip" },
      { title: "WWF Royal Rumble", system: "snes", file: "./roms/WWF Royal Rumble (USA).zip" },
      { title: "WWF Super WrestleMania", system: "snes", file: "./roms/WWF Super WrestleMania (USA).zip" },
      { title: "WWF WrestleMania - The Arcade Game", system: "snes", file: "./roms/WWF WrestleMania - The Arcade Game (USA).zip" },
      { title: "X-Men - Mutant Apocalypse", system: "snes", file: "./roms/X-Men - Mutant Apocalypse (USA).zip" }
    ];

    async function initDiscord() {
      try {
        const discordSdk = new DiscordSDK(DISCORD_CLIENT_ID);
        await discordSdk.ready();
        patchUrlMappings([
          { prefix: "/ejs-cdn", target: "cdn.emulatorjs.org" }
        ]);
      } catch (err) {
        console.warn("Running outside Discord or SDK init skipped:", err);
      }
    }

    const libraryEl = document.getElementById("library");
    GAMES.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card";
      card.innerHTML = `
        <span class="system-badge">${game.system}</span>
        <div class="game-title">${game.title}</div>
      `;
      card.onclick = () => launchGame(game);
      libraryEl.appendChild(card);
    });

    window.launchGame = function(game) {
      document.getElementById("library").style.display = "none";
      document.getElementById("player-container").style.display = "block";
      document.getElementById("back-btn").style.display = "block";
      document.getElementById("header-title").textContent = game.title;

      const isDiscord = window.location.hostname.includes("discordsays.com");
      const cdnBase = isDiscord ? "/ejs-cdn/stable/data/" : "https://cdn.emulatorjs.org/stable/data/";

      window.EJS_player = "#game";
      window.EJS_core = game.system;
      window.EJS_gameUrl = game.file;
      window.EJS_pathtodata = cdnBase;
      window.EJS_startOnLoaded = true;

      const script = document.createElement("script");
      script.src = cdnBase + "loader.js";
      document.body.appendChild(script);
    };

    initDiscord();
  </script>
</body>
</html>

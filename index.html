<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #1e1f22; color: #f2f3f5; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
    header { position: absolute; top: 0; left: 0; right: 0; height: 50px; background: #2b2d31; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111214; z-index: 10; }
    h1 { font-size: 1.1rem; font-weight: 700; white-space: nowrap; }
    #search-input { background: #1e1f22; border: 1px solid #3f4147; color: white; padding: 6px 12px; border-radius: 4px; outline: none; width: 250px; font-size: 0.9rem; }
    #search-input:focus { border-color: #5865f2; }
    #back-btn { background: #5865f2; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; display: none; }
    #back-btn:hover { background: #4752c4; }
    
    #library { 
      position: absolute; 
      top: 50px; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      padding: 24px; 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
      grid-auto-rows: 190px; 
      gap: 16px; 
      overflow-y: auto; 
    }
    
    .game-card { 
      background: #2b2d31; 
      border: 1px solid #3f4147; 
      border-radius: 8px; 
      padding: 12px; 
      cursor: pointer; 
      transition: transform 0.15s, border-color 0.15s; 
      display: flex; 
      flex-direction: column; 
      height: 190px; 
      gap: 8px; 
      overflow: hidden; 
    }
    .game-card:hover { transform: translateY(-3px); border-color: #5865f2; box-shadow: 0 4px 12px rgba(88, 101, 242, 0.2); }
    .card-thumb { width: 100%; height: 95px; background: #111214; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 0.8rem; color: #80848e; text-align: center; flex-shrink: 0; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .system-badge { display: inline-block; background: #5865f2; font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; width: fit-content; text-transform: uppercase; flex-shrink: 0; }
    .game-title { font-size: 0.85rem; font-weight: 600; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex-shrink: 0; }
    
    #player-container { position: absolute; top: 50px; bottom: 0; left: 0; right: 0; display: none; background: #000; z-index: 5; }
    #game { width: 100%; height: 100%; }
  </style>
</head>

      { title: "Altered Beast", system: "segaMD", file: "./roms/Altered Beast (REV 02) (JU) [h4].bin" },
      { title: "Comix Zone", system: "segaMD", file: "./roms/Comix Zone (U).md" },
      { title: "Dragon - The Bruce Lee Story", system: "segaMD", file: "./roms/Dragon - The Bruce Lee Story.bin" },
      { title: "Golden Axe", system: "segaMD", file: "./roms/Golden Axe (W) (REV 00) [p1].bin" },
      { title: "Michael Jackson's Moonwalker", system: "segaMD", file: "./roms/Michael Jackson's Moonwalker.smd" },
      { title: "Mortal Kombat 5", system: "segaMD", file: "./roms/Mortal Kombat 5.bin" },
      { title: "NBA Jam", system: "segaMD", file: "./roms/NBA Jam.bin" },
      { title: "Primal Rage", system: "segaMD", file: "./roms/Primal Rage.bin" },
      { title: "Rock n' Roll Racing", system: "segaMD", file: "./roms/Rock n' Roll Racing.bin" },
      { title: "Shinobi 3 - Return of the Ninja Master", system: "segaMD", file: "./roms/Shinobi 3 - Return of the Ninja Master.bin" },
      { title: "Sonic & Knuckles", system: "segaMD", file: "./roms/Sonic & Knuckles.bin" },
      { title: "Streets of Rage", system: "segaMD", file: "./roms/Streets of Rage.bin" },
      { title: "Streets of Rage 2", system: "segaMD", file: "./roms/Streets of Rage 2.bin" },
      { title: "Streets of Rage 3", system: "segaMD", file: "./roms/Streets of Rage 3.bin" },
      { title: "Yu Yu Hakusho - Makyou Toitsusen", system: "segaMD", file: "./roms/Yu Yu Hakusho - Makyou Toitsusen (J).md" }
    ];

    async function initDiscord() {
      try {
        const discordSdk = new DiscordSDK(DISCORD_CLIENT_ID);
        await discordSdk.ready();
        patchUrlMappings([
          { prefix: "/ejs-cdn", target: "cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/" }
        ]);
      } catch (err) {
        console.warn("Running outside Discord or SDK init skipped:", err);
      }
    }

    const libraryEl = document.getElementById("library");
    
    function renderLibrary(filter = "") {
      libraryEl.innerHTML = "";
      const filtered = GAMES.filter(g => g.title.toLowerCase().includes(filter.toLowerCase()));
      
      filtered.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        
        // Optional Cover Art Integration logic: 
        // If you place cover images in a folder like `./covers/Game_Name.jpg`, 
        // you can map it or check it. Below uses a dynamic fallback structure.
        const coverPath = `./covers/${game.title.replace(/[\/\\?%*:|"<>]/g, '')}.jpg`;

        card.innerHTML = `
          <div class="card-thumb">
            <img src="${coverPath}" alt="${game.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div style="display:none; width:100%; height:100%; align-items:center; justify-content:center;">🎮 ${game.system.toUpperCase()}</div>
          </div>
          <div>
            <span class="system-badge">${game.system}</span>
            <div class="game-title">${game.title}</div>
          </div>
        `;
        card.onclick = () => launchGame(game);
        libraryEl.appendChild(card);
      });
    }

    document.getElementById("search-input").addEventListener("input", (e) => {
      renderLibrary(e.target.value);
    });

    window.launchGame = function(game) {
      document.getElementById("library").style.display = "none";
      document.getElementById("search-input").style.display = "none";
      document.getElementById("player-container").style.display = "block";
      document.getElementById("back-btn").style.display = "block";
      document.getElementById("header-title").textContent = game.title;

      const isDiscord = window.location.hostname.includes("discordsays.com");
      const cdnBase = isDiscord ? "/ejs-cdn/" : "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/";

      window.EJS_player = "#game";
      window.EJS_core = CORE_MAPPING[game.system] || game.system;
      window.EJS_gameUrl = game.file;
      window.EJS_pathtodata = cdnBase;
      window.EJS_startOnLoaded = true;

      // Clean up any stale script before injecting a fresh loader instance
      const oldScript = document.getElementById("ejs-loader-script");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "ejs-loader-script";
      script.src = cdnBase + "loader.js";
      document.body.appendChild(script);
    };

    window.returnToLibrary = function() {
      // Clear game container frame/canvas content to stop audio/emulation loop
      document.getElementById("game").innerHTML = "";
      document.getElementById("player-container").style.display = "none";
      document.getElementById("library").style.display = "grid";
      document.getElementById("search-input").style.display = "block";
      document.getElementById("back-btn").style.display = "none";
      document.getElementById("header-title").textContent = "ᴀʀᴄᴀᴅᴇ Z3R0";
    };

    renderLibrary();
    initDiscord();
  </script>
</body>
</html>
